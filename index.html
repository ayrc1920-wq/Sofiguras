<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Actividad de Figuras Geométricas</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <main class="contenedor">

    <!-- ======================================
         PANTALLA INICIAL
         ====================================== -->

    <div id="pantallaInicial">

        <h1>Actividad de Figuras Geométricas</h1>

        <p class="instruccion">
            Escribe tu nombre y descubre qué figura te corresponde.
        </p>

        <div class="tarjeta">

            <label for="nombre">
                Tu nombre
            </label>

            <input
                type="text"
                id="nombre"
                placeholder="Escribe tu nombre"
            >

            <button id="botonFigura">
                Obtener mi figura
            </button>

        </div>

    </div>


    <!-- ======================================
         RESULTADO / PERFIL
         ====================================== -->

    <div id="resultado"></div>

</main>

    <script type="module" src="js/app.js"></script>

</body>
</html>
